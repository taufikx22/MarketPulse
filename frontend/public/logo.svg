<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="100%" height="100%">
  <defs>
    <!-- Clip path to cut off the bottom-left round cap of the green line at a clean 45-degree angle -->
    <clipPath id="flat-cut">
      <polygon points="0,0 200,0 200,120 88,120 0,32" />
    </clipPath>
  </defs>

  <!-- Stylized M shape -->
  <path d="M 16,110 L 16,18 L 64,74 L 108,30 L 108,48 L 64,92 L 31,54 L 31,110 Z" fill="currentColor" />

  <!-- Lime Green Pulse line with flat cut start and rounded end -->
  <path d="M 76,108 L 115,64 L 134,92 L 174,30" 
        stroke="#82C31E" 
        strokeWidth="15" 
        strokeLinecap="round" 
        strokeLinejoin="round"
        fill="none"
        clip-path="url(#flat-cut)" />
</svg>
